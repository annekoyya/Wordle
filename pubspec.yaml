name: fp
description: A feature-rich Wordle clone built in Flutter, with Firebase-ready sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # Local persistence
  shared_preferences: ^2.2.3

  # Animations / UX
  confetti: ^0.7.0

  # Share results
  share_plus: ^10.0.2

  # Firebase (optional cloud sync / leaderboard / auth)
  firebase_core: ^3.4.0
  cloud_firestore: ^5.2.0
  firebase_auth: ^5.1.0
  http: ^1.2.2
  path_provider: ^2.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/words/answers.json
    - assets/words/valid_guesses.json
    - assets/words/definitions.json
